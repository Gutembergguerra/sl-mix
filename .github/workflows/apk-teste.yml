name: APK de teste
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk-teste.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar o APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publicar o APK na página de versões
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SL-Mix-teste.apk
          gh release delete apk-teste -y --cleanup-tag || true
          gh release create apk-teste SL-Mix-teste.apk --prerelease --title "APK de teste do SL-Mixer" --notes "APK de teste. Abre o SL-Mixer pelo Chrome, em tela cheia. Para instalar, baixe e permita a instalação de fontes desconhecidas."
